[project]
name = "qurious-crafting-log"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flet>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.flet]
product = "モンハン錬成結果 記録・検索"
company = "qurious-crafting-log"
org = "com.qurious-crafting-log"

[tool.flet.app]
exclude = [
    ".venv",
    ".git",
    ".pytest_cache",
    "__pycache__",
    "tests",
    "data",
    "build",
    "scripts",
    "qurious_crafting_log.egg-info",
    "sample_paste_24999.txt",
    "PROGRESS.md",
    "CLAUDE.md",
]
