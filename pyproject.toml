[project]
name = "qurious-crafting-log"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flet>=0.24",
    # 練成画像の読み取り（app/ocr、取込タブの「画像から取込」）
    "numpy",
    "opencv-python-headless",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# 開発用。scripts/ocr の確認用スクリプト（spot_check.py）と kuijin_ocr の --slot-sheet で使う
ocr-dev = [
    "pillow",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.flet]
product = "モンハン錬成結果 記録・検索"
company = "qurious-crafting-log"
org = "com.qurious-crafting-log"

[tool.flet.app]
exclude = [
    ".venv",
    ".git",
    ".pytest_cache",
    "__pycache__",
    "tests",
    "data",
    "build",
    "scripts",
    "qurious_crafting_log.egg-info",
    "sample_paste_24999.txt",
    "PROGRESS.md",
    "CLAUDE.md",
    "docs",
    "app/ocr/templates/review",
]
