[project]
name = "qurious-crafting-log"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flet>=0.24",
    # 練成画像の読み取り（app/ocr、取込タブの「画像から取込」）
    "numpy",
    "opencv-python-headless",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# 開発用。scripts/ocr の確認用スクリプト（spot_check.py）と kuijin_ocr の --slot-sheet で使う
ocr-dev = [
    "pillow",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.flet]
product = "モンハン錬成結果 記録・検索"
company = "qurious-crafting-log"
org = "com.qurious-crafting-log"

[tool.flet.app]
exclude = [
    ".venv",
    ".git",
    ".pytest_cache",
    "__pycache__",
    "tests",
    "data",
    "build",
    "scripts",
    "qurious_crafting_log.egg-info",
    "sample_paste_24999.txt",
    "PROGRESS.md",
    "CLAUDE.md",
    "docs",
    "README.md",
    "installer",
]

[tool.flet.compile]
# 同梱するパッケージの .py を .pyc にしない。OpenCV（cv2）は読み込み時に config.py という
# ソースファイルそのものを探すため、.pyc だけにすると「missing configuration file」で読み込めない
packages = false

[tool.flet.flutter.pubspec.dependency_overrides]
# Flet のひな形は jni を 1.0.0 に固定しているが、jni_flutter 1.0.4+1（2026-10-08 公開）は jni 1.1.0 以上を
# 前提にしていて、ビルドが「Constant evaluation error」（generated_plugin.dart の JniVersionCheck）で失敗する。
# ビルドのたびに最新を取り直すので、通っていた 1.0.3 に固定する（Flet を上げたら外せるか確かめる）
jni_flutter = "1.0.3"
